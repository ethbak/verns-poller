name: poll
on:
  workflow_dispatch:
    inputs:
      runners: {description: "JSON list, one entry per parallel chain", default: "[1,2,3,4]"}
      duration: {description: "max seconds per runner", default: "20700"}
      interval: {description: "seconds between reads per runner", default: "2"}
      probe: {description: "1 = only report statuses, no chaining", default: ""}
permissions:
  actions: write
  contents: read
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        n: ${{ fromJSON(inputs.runners) }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 poll.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_DETECT_TOPIC }}
          DURATION: ${{ inputs.duration }}
          INTERVAL: ${{ inputs.interval }}
          PROBE: ${{ inputs.probe }}
      # Each chain replaces itself with a fresh job (new VM, new IP) until Monday's last
      # seating has passed. The Mac watcher stops chains by disabling this workflow and
      # cancelling runs; cancelled runs must not replace themselves. Capped so chains can
      # never multiply.
      - if: ${{ !cancelled() && inputs.probe == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(TZ=America/New_York date +%Y%m%d%H%M)
          if [ "$now" -ge 202610192145 ]; then echo "past Monday's last seating; stopping chain"; exit 0; fi
          live=$(gh run list -R "$GITHUB_REPOSITORY" -w poll.yml --json status \
            -q '[.[] | select(.status=="queued" or .status=="in_progress")] | length')
          if [ "$live" -gt 6 ]; then echo "$live runs live; not dispatching"; exit 0; fi
          gh workflow run poll.yml -R "$GITHUB_REPOSITORY" -f runners='[${{ matrix.n }}]' \
            -f duration='${{ inputs.duration }}' -f interval='${{ inputs.interval }}'
